name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Permisos mínimos
permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
      sql: ${{ steps.filter.outputs.sql }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'leadhunter-pro/web/**'
            python:
              - 'leadhunter-pro/scripts/**'
              - 'leadhunter-pro/gui/**'
              - 'leadhunter-pro/main.py'
              - 'leadhunter-pro/tests/**'
              - 'leadhunter-pro/requirements.txt'
            sql:
              - 'leadhunter-pro/supabase/**'

  web:
    name: Web · typecheck + lint + build
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leadhunter-pro/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: leadhunter-pro/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build
        env:
          # Valores dummy: el build no llama a Supabase, solo necesita que
          # las env vars existan para no romper en createBrowserClient().
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_key_for_build

  python:
    name: Python · pytest + ruff
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leadhunter-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: leadhunter-pro/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check scripts/ tests/ main.py

      - name: Tests (unittest discover)
        run: python -m unittest discover -s tests -v

  sql-lint:
    name: SQL · sintaxis con sqlfluff
    needs: detect-changes
    if: needs.detect-changes.outputs.sql == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlfluff
      - name: Lint SQL
        run: |
          sqlfluff lint leadhunter-pro/supabase/migrations/ \
            --dialect postgres \
            --exclude-rules L016,L022,L032,L034
        continue-on-error: true   # primer rodaje: no bloqueamos
