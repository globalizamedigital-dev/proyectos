[project]
name = "cazador-api"
version = "0.1.0"
description = "FastAPI thin layer que expone los módulos de scripts/ como REST a la web Next.js."
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",

    # Auth: validación JWT contra JWKS de Supabase Auth (ES256)
    "pyjwt[crypto]>=2.10",
    "cryptography>=43",
    "httpx>=0.27",

    # Cliente Supabase (service_role para escrituras backend)
    "supabase>=2.10",

    # Logging estructurado
    "python-json-logger>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

# api/ es un app folder, NO una librería distribuible. Le decimos a
# setuptools explícitamente que no busque módulos para empaquetar.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
